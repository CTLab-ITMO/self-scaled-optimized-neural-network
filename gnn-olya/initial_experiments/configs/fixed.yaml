# =============================================================================
#  ЗАФИКСИРОВАННАЯ ЧАСТЬ ЭКСПЕРИМЕНТА
# =============================================================================
#  Единственная свободная переменная в работе - матрица смежности A
#  (реестр кандидатов: src/graphs.py). Всё остальное - здесь и не меняется.
#
#  ВАЖНО: sha256 этого файла пишется в каждую строку results.csv.
#  Любая правка делает новые результаты несравнимыми со старыми, и это будет
#  видно по несовпадению хеша. Если правка всё же нужна - поднимай
#  experiment.version и перезапускай ВСЁ с нуля, а не дописывай к старому csv.
# =============================================================================

experiment:
  name: graph-vs-metric-mnist
  version: 1

data:
  dataset: mnist
  npz_path: artifacts/mnist.npz   # готовится src/prepare_data.py, едет на флешке
  side: 28                        # изображение side x side
  d: 784                          # число признаков = число вершин = side^2
  n_val: 5000                     # отрезается от train, стратифицированно
  n_train: 55000                  # остаток train (55000 + 5000 = 60000)
  n_test: 10000                   # полный тест MNIST, не трогаем
  scale: 255.0                    # x <- x / scale
                                  # ТОЛЬКО глобальная нормализация.
                                  # По-пиксельную стандартизацию делать НЕЛЬЗЯ:
                                  # у краевых пикселей std ~ 0, деление на неё
                                  # раздувает шум и ломает эксперимент.
  split_seed: 1234                # разбиение НЕ зависит от сида прогона
  permutation_seed: 1234          # перестановка признаков pi

  # Режим отладки (флаг --dev). Нужен, чтобы цикл правки занимал секунды.
  # На финальные прогоны НЕ используется.
  dev:
    pool: 2                       # avg-pool 2x2 -> side 14, d = 196
    n_train: 5000
    n_val: 1000
    n_test: 2000
    epochs: 5

model:
  kind: gcn
  layers: 3                       # L
  hidden: 64
  activation: relu
  readout: mean                   # h_i = mean_v H^(L)[i, v, :]
  n_classes: 10
  bias: true
  self_loops: true                # A_hat = D^(-1/2) (A + I) D^(-1/2)
  dropout: 0.0
  batchnorm: false

  # НИКОГДА не включать. Positional encoding даёт модели идентичность вершины
  # в обход A - а именно её отсутствие и делает эксперимент осмысленным.
  # См. PLAN.md, п. 0.1.
  positional_encoding: false

# Референс-потолок: обычный MLP на сырых d признаках, без всякого графа.
# Показывает, сколько информации в данных вообще есть.
mlp_reference:
  hidden: [512, 256]
  activation: relu
  dropout: 0.0

train:
  optimizer: adam
  lr: 0.001
  weight_decay: 0.0
  batch_size: 256
  epochs: 150
  scheduler: none
  loss: cross_entropy
  model_selection: best_val_accuracy   # одинаковый критерий для всех A
  deterministic: true                  # достижимо: только GEMM, без atomics

# Сид управляет ТОЛЬКО инициализацией весов и порядком батчей.
# Разбиение данных и pi от него не зависят.
seeds: [0, 1, 2, 3, 4]

# Параметры построения кандидатов A. Граф - это независимая переменная
# эксперимента, поэтому он ОБЯЗАН быть одинаковым во всех прогонах.
# Отсюда отдельный graph_seed: сид прогона на графы не влияет.
graphs:
  graph_seed: 777
  knn_k: [4, 8, 16]        # для knn_corr_k*
  ws_p: [0.05, 0.1, 0.25, 0.5, 1.0]   # доля перепроводки для кривой W
  n_blocks: 16             # число кластеров для патологии blocks

paths:
  artifacts: artifacts
  results: results
